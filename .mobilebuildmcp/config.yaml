# MobileBuildMCP defaults for this repo. Generated by ~/.agents/mac/mbm-config.py; edit freely.
# Agents: call session_show_defaults, then build_run_sim / test_sim (or the macOS tools) with no arguments.
# xcode-ide proxies Xcode 27's mcpbridge: xcode_ide_list_tools, then xcode_ide_call_tool
# (RenderPreview, RunSomeTests, GetTopCrashIssues, DocumentationSearch, StringCatalog*).
# Simulators are set by name, not UDID, so every clone and worktree resolves them on its own Mac.
schemaVersion: 1
enabledWorkflows:
  - macos
  - coverage
  - project-discovery
  - utilities
  - xcode-ide
sentryDisabled: true
sessionDefaults:
  projectPath: ./Ember.xcodeproj
  scheme: Ember
  configuration: Debug
  platform: macOS
  bundleId: com.cohen.ember

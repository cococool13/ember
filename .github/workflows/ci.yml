# Build, test and secret scan on every pull request and every push to main.
# design-guard.yml runs the design check separately.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # LicenseKit lives in the private cococool13/licensing repo. LICENSING_TOKEN is a read-only token for it.
      - name: LicenseKit access
        env:
          TOKEN: ${{ secrets.LICENSING_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "::error::Add the LICENSING_TOKEN repo secret (read access to cococool13/licensing)"; exit 1; }
          git config --global url."https://x-access-token:${TOKEN}@github.com/cococool13/licensing".insteadOf "https://github.com/cococool13/licensing"
      - name: Tools
        run: brew install xcodegen
      - name: Test
        run: |
          xcodegen generate
          xcodebuild -scheme Ember -destination "platform=macOS" -scmProvider system CODE_SIGNING_ALLOWED=NO test

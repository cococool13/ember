# Build, test and secret scan on every pull request and every push to main.
# design-guard.yml runs the design check separately.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Site media regression
        run: node --test site/qa/hero-media.test.mjs
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # LicenseKit lives in the private cococool13/licensing repo. LICENSING_DEPLOY_KEY is a read-only deploy key for it.
      - name: LicenseKit access
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.LICENSING_DEPLOY_KEY }}
      - name: Fetch LicenseKit over SSH
        run: git config --global url."git@github.com:cococool13/licensing".insteadOf "https://github.com/cococool13/licensing"
      - name: Tools
        run: brew install xcodegen
      - name: Test
        run: |
          xcodegen generate
          # The location entitlement test inspects the signed test host.
          xcodebuild -scheme Ember -destination "platform=macOS" -scmProvider system CODE_SIGN_IDENTITY=- test

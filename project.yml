name: Ember
options:
  bundleIdPrefix: com.cohen
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: CU8NTJWQ43
    ENABLE_TESTABILITY: YES
  configs:
    Debug:
      COMPILATION_CACHE_ENABLE_CACHING: YES
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    # 3.85.3 is the floor: it fixes posthog-ios #857 (EXC_GUARD at launch under Enhanced Security).
    from: 3.92.0
  LicenseKit:
    url: https://github.com/cococool13/licensing.git
    from: 1.0.0
targets:
  Ember:
    type: application
    platform: macOS
    sources:
      - Ember
    dependencies:
      - package: LicenseKit
      - package: PostHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cohen.ember
        PRODUCT_NAME: Ember
        ARCHS: "arm64 x86_64"
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Ember/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Ember
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 Cohen Coolidge
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSMultipleInstancesProhibited: YES
        INFOPLIST_KEY_NSLocationUsageDescription: Sunrise and sunset follow where you are. Location stays on this Mac.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Sunrise and sunset follow where you are. Location stays on this Mac.
        CODE_SIGN_ENTITLEMENTS: Ember/Ember.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        MARKETING_VERSION: 0.5.0
        CURRENT_PROJECT_VERSION: 6
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # PostHog error tracking. The project token (phc_...) is public by design; paste it here.
        # While it is REPLACE_ME, ErrorTracking.start() does nothing. The personal API key for dSYM
        # upload is a secret and never goes here (see scripts/upload-dsyms.sh).
        POSTHOG_PROJECT_TOKEN: REPLACE_ME
        POSTHOG_HOST: https://us.i.posthog.com
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    scheme:
      testTargets:
        - EmberTests
  EmberTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - EmberTests
    dependencies:
      - target: Ember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cohen.ember.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ember.app/Contents/MacOS/Ember
        BUNDLE_LOADER: $(TEST_HOST)

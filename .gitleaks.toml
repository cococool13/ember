# Standard Cohen project allowlists. Safe defaults — tighten if you add new secret file patterns.
#
# Path allowlists cover gitignored locals that Cursor/gitleaks --no-git still scans.
# Generated trees are excluded because they are not authored source.

title = "project"

[extend]
useDefault = true

[[allowlists]]
description = "Generated and vendored trees — not authored source"
paths = [
  '''(^|/)build/''',
  '''(^|/)node_modules/''',
  '''(^|/)target/''',
  '''(^|/)\\.next/''',
  '''(^|/)out/''',
  '''(^|/)dist/''',
  '''(^|/)\\.turbo/''',
  '''(^|/)coverage/''',
  '''(^|/)\\.wrangler/''',
  '''(^|/)\\.claude/worktrees/''',
  '''(^|/)\.worktrees/''',
  '''(^|/)worktrees/''',
]

[[allowlists]]
description = "Local gitignored secret files — never commit real credentials here"
paths = [
  '''(^|/)\.dev\.vars$''',
  '''(^|/)Secrets\.swift$''',
  '''(^|/)Secrets\.xcconfig$''',
  '''(^|/)LocalSecrets\.plist$''',
  '''(^|/)\.env$''',
  '''(^|/)\.env\.[^/]+$''',
  '''(^|/)credentials\.json$''',
]

[[allowlists]]
description = "PostHog project keys (phc_) are public client keys by design; see docs/analytics.md"
regexes = ['''phc_[A-Za-z0-9]{20,}''']

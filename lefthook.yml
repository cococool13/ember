# Runs automatically on commit. Install once per clone with: lefthook install
# Formatting auto-fixes and re-stages. Secret scanning hard-blocks.
# Linters report but do NOT block (remove the "|| true" once a repo is clean).
pre-commit:
  parallel: true
  commands:
    swiftformat:
      glob: "*.swift"
      run: swiftformat {staged_files}
      stage_fixed: true
    biome-format:
      glob: "*.{js,jsx,ts,tsx,json,jsonc}"
      run: biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    gitleaks:
      run: gitleaks protect --staged --no-banner
    swiftlint:
      glob: "*.swift"
      run: swiftlint lint --quiet {staged_files} || true
    biome-lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: biome lint {staged_files} || true

# Pre-push runs `just check` on each pushed commit (skipped when that commit
# already passed). Same command as agents and ship.
pre-push:
  commands:
    check:
      use_stdin: true
      run: .ci/bin/ci-pre-push
